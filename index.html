<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة سمسم في بايثون</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: a pastel candy-island sticker book organised as 12 class sessions in 3 phases. Soft jelly buttons, scalloped world cards, a chubby mascot everywhere. One committed light world. */
:root{
  color-scheme: light;
  --bg:#FFF3F7;
  --ink:#5A3E4B; --muted:#94737F; --card:#FFFFFF; --soft:#FFF8FA; --line:#F6D3DF;
  --pink:#FF8FB1; --pink-d:#E0608A; --sky:#6EC1FF; --sky-d:#3A95DD; --mint:#4FD69C; --mint-d:#26A872;
  --sun:#FFD95E; --sun-d:#E0AE22; --lav:#C9B6FF; --lav-d:#9C85E6;
  --good-bg:#E4FAEF; --bad-bg:#FFE8EE; --warn-bg:#FFF6D8;
  --ed-bg:#2F2D45; --ed-bar:#3B3956; --ed-gutter:#29273D; --ed-fg:#F3F0FF; --ed-kw:#FF9EC4; --ed-str:#FFE08A; --ed-num:#9BF0C9; --ed-bi:#8FD3FF; --ed-com:#9C99BC; --ed-fn:#C9F59B;
  --display:"Baloo Bhaijaan 2", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", "Baloo Bhaijaan 2", ui-monospace, "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--display); color:var(--ink); font-size:18px; line-height:1.7;
  background:radial-gradient(1200px 600px at 100% -10%, #FFE3EC 0, transparent 60%), radial-gradient(900px 600px at -10% 30%, #E3F0FF 0, transparent 60%), radial-gradient(900px 700px at 110% 90%, #E2FAEE 0, transparent 60%), var(--bg);
  background-attachment:fixed; min-height:100%}
button{font-family:inherit; color:inherit}
:focus-visible{outline:4px solid var(--sky-d); outline-offset:3px}

.deco{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.cloud{position:absolute; width:120px; height:40px; background:#fff; border-radius:40px; opacity:.85}
.cloud::before,.cloud::after{content:""; position:absolute; background:#fff; border-radius:50%}
.cloud::before{width:56px; height:56px; top:-28px; left:18px}
.cloud::after{width:40px; height:40px; top:-18px; left:62px}
.c1{top:14%; left:4%} .c2{top:62%; right:3%; transform:scale(1.3)} .c3{top:88%; left:30%; transform:scale(.8)}
.spark{position:absolute; color:#FFC2D6; font-size:22px}
@media (prefers-reduced-motion:no-preference){
  .cloud{animation:drift 22s ease-in-out infinite alternate} .c2{animation-duration:30s}
  .spark{animation:twinkle 3s ease-in-out infinite}
}
@keyframes drift{to{translate:60px 0}}
@keyframes twinkle{50%{opacity:.25; scale:.7}}

.wrap{position:relative; z-index:1; max-width:1320px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 56px}

.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border-bottom:3px solid var(--line)}
.top-in{max-width:1320px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:8px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.35rem; cursor:pointer; background:none; border:0; padding:0; color:var(--pink-d)}
.brand .m{width:52px; height:52px}
.stats{display:flex; gap:8px; margin-inline-start:auto; flex-wrap:wrap; align-items:center}
.pill{display:inline-flex; align-items:center; gap:6px; background:var(--soft); border:2.5px solid var(--line); border-radius:999px; padding:1px 14px; font-weight:800; font-size:1rem; white-space:nowrap}
.pill b{color:var(--pink-d); font-variant-numeric:tabular-nums}
.pill.xp{background:#FFF6D8; border-color:#F8DE87} .pill.xp b{color:#C8901A}
.pill.rank{background:#EFE9FF; border-color:#D8CCFF; color:#7A60D6}
.iconbtn{background:var(--soft); border:2.5px solid var(--line); border-radius:50%; width:42px; height:42px; display:grid; place-items:center; cursor:pointer; color:var(--pink-d)}
.iconbtn svg{width:22px; height:22px}

.btn{--bc:#fff; --bd:var(--line); --bt:var(--ink);
  display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--bc); color:var(--bt); border:3px solid var(--bd); border-radius:999px; padding:7px 20px; font-size:1.08rem; font-weight:800; cursor:pointer; line-height:1.5;
  box-shadow:0 5px 0 var(--bd), inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.05); transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translateY(-2px); box-shadow:0 7px 0 var(--bd), inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.05)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--bd)}
.btn[disabled]{opacity:.5; cursor:not-allowed; transform:none}
.btn svg{width:22px; height:22px; flex:none}
.btn.pink{--bc:var(--pink); --bd:var(--pink-d); --bt:#fff}
.btn.sky{--bc:var(--sky); --bd:var(--sky-d); --bt:#fff}
.btn.mint{--bc:var(--mint); --bd:var(--mint-d); --bt:#fff}
.btn.sun{--bc:var(--sun); --bd:var(--sun-d)}
.btn.lav{--bc:var(--lav); --bd:var(--lav-d); --bt:#fff}
.btn.big{font-size:1.3rem; padding:11px 30px}
.btn.small{font-size:.95rem; padding:3px 14px; box-shadow:0 3px 0 var(--bd)}

.hero{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; padding-block:30px 10px}
.hero h1{font-size:clamp(2.2rem, 6vw, 3.9rem); line-height:1.15; margin:0 0 6px; font-weight:800; text-wrap:balance}
.hero h1 .py{font-family:var(--mono); color:#fff; background:var(--pink); border:3px solid var(--pink-d); border-radius:22px; padding:0 16px; display:inline-block; transform:rotate(-4deg); box-shadow:0 6px 0 var(--pink-d); font-size:.78em}
.hero .lead{font-size:1.25rem; margin:0 0 14px; color:var(--muted); max-width:44ch; font-weight:600}
.flow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 18px; font-weight:800}
.flow span.st{background:#fff; border:2.5px solid var(--line); border-radius:999px; padding:2px 14px}
.flow span.ar{color:var(--pink)}
.hero-actions{display:flex; gap:14px; flex-wrap:wrap}
.hero-m{position:relative; width:min(250px, 32vw)}
.hero-m .m{width:100%; height:auto}
.bubble{position:absolute; top:-6px; inset-inline-end:76%; background:#fff; border:3px solid var(--line); border-radius:22px; padding:6px 14px; font-weight:800; white-space:nowrap; box-shadow:0 5px 0 var(--line)}
@media (prefers-reduced-motion:no-preference){ .hero-m .m{animation:bob 3s ease-in-out infinite} }
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}

.progress-row{display:flex; align-items:center; gap:14px; margin:10px 0 22px; flex-wrap:wrap; font-weight:800}
.bar{flex:1; min-width:180px; height:24px; background:#fff; border:3px solid var(--line); border-radius:999px; overflow:hidden}
.bar > i{display:block; height:100%; border-radius:999px; background:repeating-linear-gradient(-45deg, #FF9EBE 0 12px, #FFB8CF 12px 24px); transition:width .6s}
.progress-row strong{font-variant-numeric:tabular-nums}

.fun{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:16px; margin-bottom:30px}
.tile{--tc:#fff; --tb:var(--line); background:var(--tc); border:3px solid var(--tb); border-radius:26px; box-shadow:0 6px 0 var(--tb); padding:12px 16px; display:flex; gap:12px; align-items:center; cursor:pointer; text-align:start; transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile .ico{font-size:2.2rem; line-height:1; flex:none; width:56px; height:56px; display:grid; place-items:center; background:#fff; border-radius:50%; border:3px solid var(--tb)}
.tile h3{margin:0; font-size:1.15rem; line-height:1.3}
.tile p{margin:0; font-size:.92rem; color:var(--muted); font-weight:600; line-height:1.4}
.tile.ready .ico{background:#FFF6D8}
@media (prefers-reduced-motion:no-preference){ .tile.ready .ico{animation:wiggle 1.2s ease-in-out infinite} }
@keyframes wiggle{0%,60%,100%{rotate:0} 70%{rotate:-12deg} 80%{rotate:10deg} 90%{rotate:-6deg}}

.phase{margin:34px 0 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.phase h2{margin:0; font-size:clamp(1.4rem, 3.4vw, 1.9rem); line-height:1.25}
.phase .pp{background:#fff; border:2.5px solid var(--line); border-radius:999px; padding:0 12px; font-weight:800; color:var(--muted); font-size:.95rem; font-variant-numeric:tabular-nums}
.legend{display:flex; gap:8px 16px; flex-wrap:wrap; font-weight:700; color:var(--muted); font-size:.95rem}
.legend span{display:inline-flex; gap:6px; align-items:center}
.worlds{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 390px), 1fr)); gap:30px 26px}
.world{background:var(--card); border:3px solid var(--wb); border-radius:34px; box-shadow:0 8px 0 var(--wb); overflow:hidden; display:flex; flex-direction:column}
.world-head{position:relative; background:var(--wc); padding:16px 20px 22px; display:flex; gap:14px; align-items:center}
.world-head::after{content:""; position:absolute; left:0; right:0; bottom:-13px; height:14px; background:radial-gradient(circle at 13px 0, var(--wc) 12px, transparent 12.5px) repeat-x; background-size:26px 14px}
.sticker{flex:none; width:64px; height:64px; display:grid; place-items:center; font-size:2.2rem; background:#fff; border-radius:50%; border:3px solid var(--wb); transform:rotate(-8deg); box-shadow:0 4px 0 var(--wb)}
.world-head h3{margin:0; font-size:1.5rem; line-height:1.2}
.wn{font-size:.95rem; font-weight:700; color:var(--muted)}
.ses{display:inline-block; background:#fff; border:2px solid var(--wb); border-radius:999px; padding:0 10px; font-weight:800; font-size:.85rem; color:var(--ink); margin-inline-end:6px}
.token{font-family:var(--mono); font-weight:700; font-size:.88rem; background:#fff; border:2px dashed var(--wb); border-radius:10px; padding:0 8px; direction:ltr; display:inline-block; margin-top:2px}
.badge-done{margin-inline-start:auto; background:#fff; border:3px solid var(--wb); border-radius:999px; padding:0 12px; font-weight:800; font-size:.9rem; white-space:nowrap}
.world-body{padding:22px 20px 26px; display:flex; flex-direction:column; gap:12px; flex:1}
.world-body > p{margin:0; color:var(--muted); font-weight:600}
.coins{display:flex; flex-wrap:wrap; gap:22px 12px; padding-top:4px}
.coin{position:relative; width:76px; display:flex; flex-direction:column; align-items:center; gap:1px; background:none; border:0; cursor:pointer; padding:0}
.coins .coin:nth-child(even){transform:translateY(14px)}
.coin .disc{position:relative; width:62px; height:62px; border-radius:50%; border:3px solid var(--wb); background:#fff; display:grid; place-items:center; font-weight:800; font-size:1.4rem; box-shadow:0 5px 0 var(--wb), inset 0 -5px 0 rgba(0,0,0,.04); transition:transform .12s}
.coin .kind{position:absolute; top:-8px; inset-inline-end:-10px; font-size:1rem; width:28px; height:28px; display:grid; place-items:center; background:#fff; border:2px solid var(--wb); border-radius:50%}
.coin:hover .disc{transform:translateY(-3px) scale(1.06)}
.coin.done .disc{background:var(--wc)}
.coin.current .disc{background:var(--sun); border-color:var(--sun-d); box-shadow:0 5px 0 var(--sun-d)}
@media (prefers-reduced-motion:no-preference){ .coin.current .disc{animation:pulse 1.4s ease-in-out infinite} }
@keyframes pulse{50%{box-shadow:0 5px 0 var(--sun-d), 0 0 0 10px rgba(255,217,94,.4)}}
.coin.locked{cursor:not-allowed}
.coin.locked .disc{background:#F4EEF1; color:#C9B5BE; border-color:#E5D7DE; box-shadow:0 5px 0 #E5D7DE}
.coin.locked .disc svg{width:24px; height:24px}
.coin .mini{font-size:.8rem; font-weight:700; line-height:1.3; text-align:center; color:var(--muted); max-width:82px}
.stars{display:flex; gap:1px; direction:ltr}
.stars svg{width:16px; height:16px}
.grad{margin-top:30px; background:linear-gradient(135deg, #FFF6D8, #FFEFF5); border:3px solid #F0B429; border-radius:34px; box-shadow:0 8px 0 #F0B429; padding:20px 24px; display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.grad .m{width:96px; height:96px; flex:none}
.grad h3{margin:0; font-size:1.6rem}
.grad p{margin:0; color:var(--muted); font-weight:600}
.grad > div{flex:1; min-width:220px}
.foot{margin-top:36px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; color:var(--muted); font-weight:600; font-size:.95rem}

.lvl-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:18px 16px}
.crumb{display:flex; flex-direction:column; min-width:0}
.crumb small{font-weight:700; color:var(--muted); font-size:1rem}
.crumb h1{margin:0; font-size:clamp(1.6rem, 4vw, 2.4rem); line-height:1.2; text-wrap:balance}
.kindtag{display:inline-flex; align-items:center; gap:4px; background:var(--wc); border:2.5px solid var(--wb); border-radius:999px; padding:0 12px; font-weight:800; font-size:.95rem; margin-inline-start:6px; vertical-align:middle}
.lvl-nav{margin-inline-start:auto; display:flex; gap:10px}
.bench{display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 7fr); gap:24px; align-items:start}
.bench.solo{grid-template-columns:minmax(0, 1fr); max-width:820px; margin:0 auto}
@media (max-width:980px){ .bench{grid-template-columns:minmax(0,1fr)} }
.col{display:flex; flex-direction:column; gap:24px; min-width:0}
.panel{background:var(--card); border:3px solid var(--pb, var(--line)); border-radius:30px; box-shadow:0 7px 0 var(--pb, var(--line)); overflow:hidden; min-width:0}
.panel-h{display:flex; align-items:center; gap:10px; padding:10px 20px; background:var(--ph, var(--wc)); font-weight:800; font-size:1.2rem; flex-wrap:wrap}
.panel-h .tag{background:#fff; border:2.5px solid var(--pb, var(--wb)); border-radius:999px; padding:0 12px; font-size:.95rem}
.panel.quiz{--pb:#F2C94C; --ph:#FFF0B3}
.panel.task{--pb:#F49AB8; --ph:#FFD1DF}
.panel.playp{--pb:#7DB8F2; --ph:#CFE8FF}
.panel.lessonp{--pb:var(--wb); --ph:var(--wc)}
.panel-b{padding:18px 20px 22px; display:flex; flex-direction:column; gap:14px; min-width:0}
.panel-b p{margin:0}
.lesson p{font-size:1.15rem}
.ideas{margin:0; padding-inline-start:22px; display:flex; flex-direction:column; gap:6px; font-weight:700}
code.ic{font-family:var(--mono); background:#FFEFF5; border:2px solid #FFD0E0; border-radius:8px; padding:0 6px; font-size:.88em; direction:ltr; unicode-bidi:isolate; white-space:nowrap; color:#B4436E}
.snip{border-radius:20px; overflow:hidden; border:3px solid #E3DDF5}
.snip pre{margin:0; background:var(--ed-bg); color:var(--ed-fg); padding:12px 16px; font-family:var(--mono); font-size:16px; line-height:1.65; overflow-x:auto; direction:ltr; text-align:left}
.snip .out{background:#26243A; color:#C9F7DE; font-family:var(--mono); font-size:15px; padding:8px 16px; border-top:2px dashed #4a4766; white-space:pre-wrap; unicode-bidi:plaintext; text-align:right}
.snip .out::before{content:"الناتج ◂ "; color:var(--ed-com); font-family:var(--display)}
.say{display:flex; gap:12px; align-items:flex-start}
.say .m{flex:none; width:58px; height:58px}
.say .txt{background:#FFF6D8; border:3px solid #F8DE87; border-radius:20px; padding:8px 14px; font-weight:600; min-width:0}
.say.pinkish .txt{background:#FFEFF5; border-color:#FFD0E0}
.say.blueish .txt{background:#EAF5FF; border-color:#C4E1FB}

.quiz-q{font-size:1.2rem; font-weight:800}
.opts{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap:12px}
.opt{border:3px solid #F1E1E8; background:#fff; border-radius:20px; padding:10px 14px; font-size:1.1rem; font-weight:700; cursor:pointer; box-shadow:0 4px 0 #F1E1E8; white-space:pre-wrap; unicode-bidi:plaintext; text-align:center; transition:transform .1s}
.opt:hover{transform:translateY(-2px); border-color:var(--pink)}
.opt.mono{font-family:var(--mono); font-size:1rem}
.opt.right{background:var(--good-bg); border-color:var(--mint-d); box-shadow:0 4px 0 var(--mint-d)}
.opt.wrong{background:var(--bad-bg); border-color:var(--pink-d); box-shadow:0 4px 0 var(--pink-d)}
@media (prefers-reduced-motion:no-preference){ .opt.wrong{animation:shake .35s} .opt.right{animation:boing .4s} }
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes boing{40%{transform:scale(1.07)}}
.quiz-why{border-radius:18px; padding:10px 14px; font-weight:600; border:3px solid}
.quiz-why.ok{background:var(--good-bg); border-color:#A9EBCB}
.quiz-why.no{background:var(--bad-bg); border-color:#FFC4D5}

.task-text{font-size:1.25rem; font-weight:700; line-height:1.7}
.expect{display:flex; flex-direction:column; gap:4px}
.expect span{font-weight:700; color:var(--muted); font-size:1rem}
.expect pre{margin:0; background:var(--soft); border:3px dashed #F6C4D5; border-radius:16px; padding:8px 14px; font-family:var(--mono); font-size:16px; white-space:pre-wrap; unicode-bidi:plaintext; text-align:right}

.keys{display:flex; flex-wrap:wrap; gap:6px; direction:ltr}
.key{font-family:var(--mono); font-weight:700; font-size:1.05rem; min-width:42px; height:40px; padding:0 10px; border:2.5px solid #E3DDF5; border-radius:14px; background:#F7F4FF; cursor:pointer; box-shadow:0 3px 0 #E3DDF5; color:#6D55C8}
.key:active{transform:translateY(3px); box-shadow:none}
.keys-note{font-size:.95rem; color:var(--muted); font-weight:600; margin:0}

.editor-wrap{border-radius:24px; overflow:hidden; border:3px solid #DCD4F3; box-shadow:0 6px 0 #DCD4F3}
.ed-bar{background:var(--ed-bar); display:flex; align-items:center; gap:7px; padding:8px 14px; direction:ltr}
.ed-bar i{width:13px; height:13px; border-radius:50%; display:block}
.ed-bar span{color:#B9B5D9; font-family:var(--mono); font-size:.85rem; margin-left:8px}
.editor{display:flex; direction:ltr; background:var(--ed-bg); height:300px; resize:vertical; overflow:hidden; min-height:180px}
.gutter{flex:none; width:46px; background:var(--ed-gutter); color:#6B6890; font-family:var(--mono); font-size:17px; line-height:28px; padding:14px 0; text-align:center; overflow:hidden; user-select:none}
.gutter div.err{background:var(--pink-d); color:#fff}
.code-area{position:relative; flex:1; min-width:0}
.code-area pre, .code-area textarea{position:absolute; inset:0; margin:0; border:0; padding:14px 16px; font-family:var(--mono); font-size:17px; line-height:28px; letter-spacing:0; tab-size:4; white-space:pre; word-wrap:normal; overflow-wrap:normal; text-align:left; direction:ltr}
.code-area pre{overflow:hidden; color:var(--ed-fg); pointer-events:none}
.code-area textarea{background:transparent; color:transparent; caret-color:#FFE08A; resize:none; outline:none; overflow:auto}
.code-area textarea::selection{background:rgba(143,211,255,.35); color:transparent}
.tk-k{color:var(--ed-kw); font-weight:700} .tk-s{color:var(--ed-str)} .tk-n{color:var(--ed-num)} .tk-b{color:var(--ed-bi)} .tk-c{color:var(--ed-com); font-style:italic} .tk-f{color:var(--ed-fn)}

.stdin{display:flex; flex-direction:column; gap:4px}
.stdin label{font-weight:800}
.stdin small{color:var(--muted); font-weight:600}
.stdin textarea{font-family:var(--mono); font-size:16px; border:3px solid var(--line); border-radius:16px; padding:8px 12px; min-height:68px; resize:vertical; unicode-bidi:plaintext; text-align:right; background:var(--soft); color:var(--ink)}
.actions{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.actions .spacer{flex:1}
.console{background:#26243A; border-radius:22px; border:3px solid #DCD4F3; min-height:100px; max-height:340px; overflow:auto; padding:10px 16px; font-family:var(--mono); font-size:16px; line-height:1.7; color:#F3F0FF}
.console .title{font-family:var(--display); color:#B9B5D9; font-size:.95rem; font-weight:700}
.console .ln{white-space:pre-wrap; unicode-bidi:plaintext; text-align:right; min-height:1.7em}
.console .in{color:var(--ed-str)}
.console .muted{color:var(--ed-com); font-family:var(--display)}
.live-in{font-family:var(--mono); font-size:16px; background:#3B3956; color:var(--ed-str); border:2px solid var(--ed-str); border-radius:10px; padding:2px 10px; min-width:140px; width:50%; margin-inline-start:6px; outline:none}

.fb{border:3px solid; border-radius:24px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start}
.fb.bad{background:var(--bad-bg); border-color:#FFC4D5}
.fb.warn{background:var(--warn-bg); border-color:#F8DE87}
.fb.good{background:var(--good-bg); border-color:#A9EBCB}
.fb .m{flex:none; width:60px; height:60px}
.fb-body{min-width:0; flex:1; display:flex; flex-direction:column; gap:8px}
.fb-body h4{margin:0; font-size:1.25rem}
.fb-body p{margin:0; font-weight:600}
.fb-body .tech{font-family:var(--mono); font-size:.85rem; color:var(--muted); direction:ltr; text-align:left; overflow-x:auto; white-space:pre}
.cmp{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap:10px}
.cmp div{min-width:0}
.cmp b{display:block; font-size:.95rem}
.cmp pre{margin:0; background:#fff; border:3px solid var(--line); border-radius:14px; padding:6px 12px; font-family:var(--mono); font-size:15px; white-space:pre-wrap; unicode-bidi:plaintext; text-align:right; min-height:2.2em}
.hintbox{background:#FFFBEA; border:3px dashed #F2C94C; border-radius:22px; padding:12px 16px; font-weight:600; display:flex; flex-direction:column; gap:8px}

.zone{border:3px dashed var(--line); border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:8px; min-height:80px; background:var(--soft)}
.zone.answer{background:#F7F4FF; border-color:#D8CCFF}
.zone h4{margin:0; font-size:1rem; color:var(--muted)}
.zone .empty{color:var(--muted); font-weight:600; text-align:center; padding:8px}
.chip{display:flex; align-items:center; gap:10px; direction:ltr; text-align:left; width:100%; font-family:var(--mono); font-size:16px; background:var(--ed-bg); color:var(--ed-fg); border:3px solid #DCD4F3; border-radius:16px; padding:8px 14px; cursor:pointer; box-shadow:0 4px 0 #CFC6EC; white-space:pre; overflow-x:auto; transition:transform .1s}
.chip:hover{transform:translateY(-2px)}
.chip .no{flex:none; font-family:var(--display); font-weight:800; width:26px; height:26px; border-radius:50%; background:var(--lav); color:#fff; display:grid; place-items:center; font-size:.9rem}
.chip .lead{background-image:radial-gradient(#8C88B5 1.3px, transparent 1.6px); background-size:10px 10px; background-position:center}

.modal{position:fixed; inset:0; z-index:60; background:rgba(90,62,75,.38); backdrop-filter:blur(3px); display:grid; place-items:center; padding:20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); overflow:auto}
.modal-card{background:#fff; border:4px solid var(--line); border-radius:36px; box-shadow:0 10px 0 var(--line); max-width:560px; width:100%; padding:24px 24px 28px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px}
.modal-card.wide{max-width:860px}
@media (prefers-reduced-motion:no-preference){ .modal-card{animation:pop .45s cubic-bezier(.2,1.6,.4,1)} }
@keyframes pop{from{transform:scale(.6); opacity:0}}
.modal-card h2{margin:0; font-size:2.1rem; line-height:1.2; color:var(--pink-d)}
.modal-card h3{margin:8px 0 0; font-size:1.4rem}
.modal-card p{margin:0; font-size:1.15rem; font-weight:600; color:var(--muted)}
.modal-card > .m{width:130px; height:130px}
.bigstars{display:flex; gap:8px; direction:ltr}
.bigstars svg{width:62px; height:62px}
@media (prefers-reduced-motion:no-preference){ .bigstars svg.on{animation:starin .5s backwards} .bigstars svg:nth-child(2){animation-delay:.15s} .bigstars svg:nth-child(3){animation-delay:.3s} }
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.xpgain{font-size:1.4rem; font-weight:800; background:#FFF6D8; border:3px solid #F8DE87; border-radius:999px; padding:0 18px; color:#C8901A}
.newbadge{background:#F3EEFF; border:3px solid #D8CCFF; border-radius:20px; padding:6px 16px; font-weight:800; color:#7A60D6}
.modal-actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:8px}
.grid-items{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:14px; width:100%}
.item{border:3px solid var(--line); border-radius:24px; padding:10px; background:var(--soft); display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; font-weight:800; line-height:1.35}
.item .m{width:90px; height:90px}
.item.sel{border-color:var(--pink-d); background:#FFEFF5; box-shadow:0 5px 0 var(--pink-d)}
.item.locked{filter:grayscale(1); opacity:.55; cursor:not-allowed}
.item small{color:var(--muted); font-weight:700}
.stk{font-size:3rem; line-height:1.2}

.board{width:100%; display:flex; flex-direction:column; gap:10px; text-align:start}
.addrow{display:flex; gap:10px; flex-wrap:wrap}
.addrow input{flex:1; min-width:160px; font-family:var(--display); font-size:1.1rem; border:3px solid var(--line); border-radius:999px; padding:6px 18px; background:var(--soft); color:var(--ink)}
.brow{display:flex; align-items:center; gap:10px; background:var(--soft); border:3px solid var(--line); border-radius:22px; padding:8px 12px; flex-wrap:wrap}
.brow .rk{width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; font-weight:800; background:#fff; border:2.5px solid var(--line); font-size:1.1rem}
.brow .nm{font-weight:800; font-size:1.15rem; flex:1; min-width:100px}
.brow .pts{font-weight:800; color:#C8901A; font-variant-numeric:tabular-nums; min-width:70px}
.brow .acts{display:flex; gap:6px; flex-wrap:wrap}

.cert{width:100%; background:#FFFDF6; border:6px double #F0B429; border-radius:30px; padding:26px 22px; display:flex; flex-direction:column; align-items:center; gap:6px}
.cert .m{width:120px; height:120px}
.cert .t1{font-size:clamp(1.5rem, 4vw, 2.2rem); font-weight:800; color:var(--pink-d); line-height:1.2}
.cert .t2{font-family:var(--mono); font-weight:700; letter-spacing:.06em; color:#7A60D6; direction:ltr}
.cert .who{font-size:clamp(1.8rem, 5vw, 2.8rem); font-weight:800; border-bottom:3px dashed #F0B429; padding:0 20px; min-width:60%}
.cert .meta{display:flex; gap:10px 22px; flex-wrap:wrap; justify-content:center; font-weight:800; color:var(--muted)}
.cert .sig{font-weight:800; color:var(--mint-d)}
.cert.locked{filter:grayscale(.7); opacity:.75}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:70}
.loading-note{font-weight:700; color:var(--muted)}

.speed{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:18px; padding-top:10px}
.speed-top{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.score{font-size:2rem; font-weight:800; color:var(--pink-d); font-variant-numeric:tabular-nums}
.timer{flex:1; min-width:160px; height:22px; background:#fff; border:3px solid var(--line); border-radius:999px; overflow:hidden}
.timer i{display:block; height:100%; background:linear-gradient(90deg, var(--mint), var(--sun)); border-radius:999px; transition:width .25s linear}
.timer.low i{background:var(--pink)}

@media (max-width:640px){
  body{font-size:17px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-m{display:none}
  .editor{height:270px}
  .code-area pre,.code-area textarea{font-size:15px; line-height:25px}
  .gutter{font-size:15px; line-height:25px; width:38px}
  .pill{padding:1px 10px; font-size:.9rem}
  .brand span{display:none}
  .chip{font-size:14px}
}

quest({id:"h2", w:11, title:"المشنوق ٢: الأرواح والفوز",
 lesson:[{p:"**الحصة 11: الشروط والنقاط والخسارة والفوز.** عندنا `lives` (أرواح). كل تخمين غلط ينقّص روح. ولو مفيش `_` في الكلمة يبقى كسبنا! `not in` بتسأل: مش موجود؟"},
  {code:`lives = 3\nlives -= 1\nprint(lives)\nprint("_" not in "c a t")`, out:"2\nTrue"}],
 quiz:{q:"إيه ناتج \"z\" not in \"cat\"؟", opts:["True","False"], a:0, why:"z مش موجودة في cat، فالإجابة True."},
 task:"كمّل لعبة المشنوق: (1) لو الحرف في الكلمة اطبع: صح! — غير كده نقّص lives واطبع: غلط! فاضل + lives. (2) بعد ما الكلمة تتطبع: لو مفيش _ اطبع: كسبت! واخرج — ولو lives بقت 0 اطبع: خسرت! الكلمة كانت cat واخرج.",
 starter:`word = "cat"\nguessed = []\nlives = 3\n\ndef show_word(word, guessed):\n    result = ""\n    for ch in word:\n        if ch in guessed:\n            result += ch + " "\n        else:\n            result += "_ "\n    return result.strip()\n\nwhile True:\n    letter = input()\n    guessed.append(letter)\n    # (1) صح ولا غلط؟\n\n    print(show_word(word, guessed))\n    # (2) كسب ولا خسر؟\n\n`,
 stdin:"c\nx\na\nt",
 tests:[{inputs:["c","x","a","t"], expected:"صح!\nc _ _\nغلط! فاضل 2\nc _ _\nصح!\nc a _\nصح!\nc a t\nكسبت!"},{inputs:["x","y","z"], expected:"غلط! فاضل 2\n_ _ _\nغلط! فاضل 1\n_ _ _\nغلط! فاضل 0\n_ _ _\nخسرت! الكلمة كانت cat"}],
 need:[[/lives\s*-=\s*1|lives\s*=\s*lives\s*-\s*1/, "نقّص lives بـ lives -= 1"],[/\bbreak\b/, "استخدم break لما اللعبة تخلص"]],
 hint:"    if letter in word:\n        print(\"صح!\")\n    else:\n        lives -= 1\n        print(f\"غلط! فاضل {lives}\")\n...\n    if \"_\" not in show_word(word, guessed):\n        print(\"كسبت!\")\n        break\n    if lives == 0:\n        print(\"خسرت! الكلمة كانت \" + word)\n        break",
 solution:`word = "cat"\nguessed = []\nlives = 3\n\ndef show_word(word, guessed):\n    result = ""\n    for ch in word:\n        if ch in guessed:\n            result += ch + " "\n        else:\n            result += "_ "\n    return result.strip()\n\nwhile True:\n    letter = input()\n    guessed.append(letter)\n    if letter in word:\n        print("صح!")\n    else:\n        lives -= 1\n        print(f"غلط! فاضل {lives}")\n    print(show_word(word, guessed))\n    if "_" not in show_word(word, guessed):\n        print("كسبت!")\n        break\n    if lives == 0:\n        print("خسرت! الكلمة كانت " + word)\n        break`});

function hlLine(line){
  const re = /(#.*$)|([fFrR]?"[^"]*"?|[fFrR]?'[^']*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([^\s"'#A-Za-z0-9_]+|\s+)/g;
  let out = "", m, prevDef = false;
  while((m = re.exec(line))){
    if(m[0]===""){ re.lastIndex++; continue; }
    if(m[1]) out += '<span class="tk-c">'+esc(m[1])+'</span>';
    else if(m[2]) out += '<span class="tk-s">'+esc(m[2])+'</span>';
    else if(m[3]) out += '<span class="tk-n">'+esc(m[3])+'</span>';
    else if(m[4]){ const w = m[4];
      if(prevDef){ out += '<span class="tk-f">'+w+'</span>'; prevDef=false; }
      else if(KW.has(w)){ out += '<span class="tk-k">'+w+'</span>'; prevDef = (w==="def"); }
      else if(BI.has(w)) out += '<span class="tk-b">'+w+'</span>';
      else out += w;
    } else out += esc(m[0]);
  }
  return out;
}
const hl = code => code.split("\n").map(hlLine).join("\n");

function starsHTML(n, cls){ let h='<span class="'+(cls||"stars")+'" aria-label="'+n+' نجوم">'; for(let i=0;i<3;i++) h+='<svg viewBox="0 0 24 24" class="'+(i<n?"on":"")+'"><use href="#star" fill="'+(i<n?"#FFD95E":"#F1E4EA")+'" stroke="'+(i<n?"#E0AE22":"#E3CFD8")+'"/></svg>'; return h+'</span>'; }

function norm(s){
  return String(s).replace(/\r/g,"").replace(/[ً-ْٰـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
    .split("\n").map(l=>l.replace(/[ \t]+/g," ").trim()).join("\n").replace(/^\n+|\n+$/g,"");
}
function stripComments(code){
  return code.split("\n").map(line=>{ let q=null;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(q){ if(ch===q) q=null; } else if(ch==='"'||ch==="'") q=ch; else if(ch==="#") return line.slice(0,i); }
    return line; }).join("\n");
}
function arabicOutside(code){
  const lines = code.split("\n");
  for(let i=0;i<lines.length;i++){ let q=null; const line=lines[i];
    for(let j=0;j<line.length;j++){ const ch=line[j];
      if(q){ if(ch===q) q=null; continue; }
      if(ch==='"'||ch==="'"){ q=ch; continue; }
      if(ch==="#") break;
      if(/[؀-ۿ]/.test(ch)) return {line:i+1, ch};
    } }
  return null;
}
function precheck(code){
  const lines = code.split("\n");
  for(let i=0;i<lines.length;i++){
    if(/[“”„]/.test(lines[i])) return {line:i+1, msg:"في السطر "+(i+1)+" علامات تنصيص مايلة “ ”. استخدم العلامة العادية \" من الكيبورد الإنجليزي."};
    if(/[‘’]/.test(lines[i])) return {line:i+1, msg:"في السطر "+(i+1)+" علامة تنصيص مايلة ‘ ’. استخدم ' أو \" العادية."};
  }
  const a = arabicOutside(code);
  if(a){
    if(/[،؛]/.test(a.ch)) return {line:a.line, msg:"في السطر "+a.line+" فاصلة عربي « "+a.ch+" ». بايثون بيفهم الفاصلة الإنجليزي , بس."};
    if(/[٠-٩]/.test(a.ch)) return {line:a.line, msg:"في السطر "+a.line+" أرقام عربي « "+a.ch+" ». اكتب الأرقام بالإنجليزي 0123456789."};
  }
  return null;
}

function skRead(x){
  if(typeof Sk.builtinFiles==="undefined" || Sk.builtinFiles.files[x]===undefined) throw "File not found: '"+x+"'";
  return Sk.builtinFiles.files[x];
}
function runPython(code, inputs){
  let out = "", tooMuch = false; const items = []; let qi = 0;
  Sk.configure({
    output: t => { if(out.length > 20000){ tooMuch = true; throw new Sk.builtin.RuntimeError("OUTPUT_LIMIT"); } out += t; items.push({k:"o", t}); },
    read: skRead, __future__: Sk.python3, inputfunTakesPrompt: true,
    inputfun: p => { const missing = qi >= inputs.length; const v = missing ? "" : String(inputs[qi]); qi++; items.push({k:"i", p: p==null?"":String(p), v, missing}); return v; },
    execLimit: 4000, yieldLimit: 100, killableWhile: true, killableFor: true
  });
  Sk.execLimit = 4000; Sk.execStart = Date.now();
  return Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
    .then(() => ({out, items, err:null}), e => ({out, items, err:e, tooMuch}));
}
function runLive(code, box){
  box.innerHTML = `<div class="title">شاشة البرنامج</div>`;
  let line; const newLine = () => { line = document.createElement("div"); line.className = "ln"; box.appendChild(line); };
  newLine();
  const write = t => { String(t).split("\n").forEach((p,i)=>{ if(i>0) newLine(); if(p) line.appendChild(document.createTextNode(p)); }); box.scrollTop = box.scrollHeight; };
  let total = 0, stopped = false, tooMuch = false, pending = null;
  Sk.configure({
    output: t => { total += t.length; if(total > 20000){ tooMuch = true; throw new Sk.builtin.RuntimeError("OUTPUT_LIMIT"); } write(t); },
    read: skRead, __future__: Sk.python3, inputfunTakesPrompt: true,
    inputfun: p => new Promise((resolve, reject) => {
      write(p==null ? "" : String(p));
      const inp = document.createElement("input");
      inp.className = "live-in"; inp.dir = "auto"; inp.setAttribute("aria-label", "اكتب إجابتك ودوس Enter"); inp.placeholder = "اكتب ودوس Enter";
      line.appendChild(inp); setTimeout(()=>inp.focus(), 30); box.scrollTop = box.scrollHeight;
      pending = reject;
      inp.addEventListener("keydown", e => {
        if(e.key !== "Enter") return;
        e.preventDefault();
        const v = inp.value, s = document.createElement("span"); s.className = "in"; s.textContent = v; inp.replaceWith(s);
        newLine(); pending = null; Sk.execStart = Date.now(); resolve(v);
      });
    }),
    execLimit: 5000, yieldLimit: 100, killableWhile: true, killableFor: true
  });
  Sk.execLimit = 5000; Sk.execStart = Date.now();
  liveStop = () => { stopped = true; Sk.execLimit = 1; Sk.execStart = 0; if(pending){ const r = pending; pending = null; r(new Error("STOPPED")); } };
  return Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
    .then(() => ({err:null, stopped:false}), e => ({err:e, stopped, tooMuch}))
    .finally(() => { liveStop = null; box.querySelectorAll(".live-in").forEach(x=>x.disabled = true); });
}
function stopLive(){ if(liveStop) liveStop(); }

function errInfo(e, tooMuch){
  let name = "Error", msg = "", line = null;
  try{ name = e.tp$name || (e.constructor && e.constructor.name) || "Error"; }catch(_){}
  try{ msg = e.toString(); }catch(_){ msg = String(e); }
  try{ if(e.traceback && e.traceback.length) line = e.traceback[0].lineno; }catch(_){}
  if(!line){ const m = /line (\d+)/.exec(msg); if(m) line = +m[1]; }
  if(tooMuch || /OUTPUT_LIMIT|TimeLimit|time limit|took too long/i.test(name+" "+msg)) name = "TimeLimitError";
  if(/indent/i.test(msg) && name==="SyntaxError") name = "IndentationError";
  return {name, msg, line};
}

    case "IndentationError":

    case "TypeError": t="بتخلط أنواع مع بعض"+ln; p="غالباً بتجمع نص على رقم. استخدم int() للتحويل لرقم، أو str() للتحويل لنص."; break;
    case "ValueError": t="القيمة دي مينفعش تتحول"+ln; p="int() محتاجة رقم بس، زي \"12\". اتأكد إنك كتبت رقم بالإنجليزي."; break;
    case "IndexError": t="رقم الخانة أكبر من القائمة"+ln; p="العد بيبدأ من 0، وآخر خانة رقمها len - 1، أو استخدم [-1]. ولو القائمة فاضية مينفعش pop."; break;
    case "KeyError": t="المفتاح ده مش موجود في القاموس"+ln; p="اتأكد إن اسم المفتاح مكتوب بالظبط، أو استخدم in قبلها."; break;
    case "ZeroDivisionError": t="مينفعش نقسم على صفر"+ln; p="حتى بايثون مايقدرش يعملها!"; break;
    case "AttributeError": t="الحاجة دي معندهاش الأمر ده"+ln; p="اتأكد من اسم الأمر اللي بعد النقطة، زي .append أو .upper."; break;
    case "TimeLimitError": t="البرنامج دخل في دوامة مبتخلصش"; p="غالباً عندك حلقة while الشرط بتاعها مبيبقاش غلط أبداً. اتأكد إنك بتغيّر المتغير جوه الحلقة، أو إن فيه break."; break;
    default: t="البرنامج وقع"+ln; p="اقرا الرسالة التقنية تحت، وراجع السطر ده.";
  }
  const a = arabicOutside(code);
  if(a && info.name!=="TimeLimitError") p += " ملحوظة: فيه حروف عربي برة علامات التنصيص في السطر "+a.line+" — الأوامر وأسامي المتغيرات بتتكتب بالإنجليزي.";
  return {t, p};

function beep(kind){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==="win" ? [784,988,1175,1568] : kind==="ok" ? [880,1320] : kind==="pop" ? [1200] : [330,262];
    notes.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind==="bad" ? "triangle" : "sine"; o.frequency.value = f;
      const t0 = actx.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.14, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.2);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+0.22);
    });
  }catch(e){}
}

function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"); cv.hidden = false;
  const ctx = cv.getContext("2d"); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#FF8FB1","#FFD95E","#8FE3BE","#8FD3FF","#C9B6FF","#FFB38A"];
  const P = Array.from({length:150}, ()=>({x:W/2+(Math.random()-.5)*240, y:H*0.38, vx:(Math.random()-.5)*15, vy:-Math.random()*15-5, r:Math.random()*8+7, c:cols[Math.random()*cols.length|0], a:Math.random()*6, s:Math.random()*3|0}));
  const t0 = performance.now();
  function heart(r){ ctx.beginPath(); ctx.moveTo(0, r*.3); ctx.bezierCurveTo(-r, -r*.4, -r*.4, -r, 0, -r*.35); ctx.bezierCurveTo(r*.4, -r, r, -r*.4, 0, r*.3); ctx.fill(); }
  function star(r){ ctx.beginPath(); for(let i=0;i<10;i++){ const rr = i%2 ? r*.45 : r; const an = i*Math.PI/5 - Math.PI/2; ctx.lineTo(Math.cos(an)*rr, Math.sin(an)*rr); } ctx.closePath(); ctx.fill(); }
  (function f(t){
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy+=0.4; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.a+=0.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c;
      if(p.s===0) heart(p.r); else if(p.s===1) star(p.r*.7); else { ctx.beginPath(); ctx.arc(0,0,p.r/2.6,0,7); ctx.fill(); } ctx.restore(); });
    if(t-t0 < 2800) requestAnimationFrame(f); else { ctx.clearRect(0,0,W,H); cv.hidden = true; }
  })(t0);
}

  <div class="editor-wrap"><div class="ed-bar"><i style="background:#FF8FB1"></i><i style="background:#FFD95E"></i><i style="background:#8FE3BE"></i><span>samsam.py</span></div>
  <div class="editor"><div class="gutter" id="gutter"></div><div class="code-area"><pre aria-hidden="true"><code id="hlCode"></code></pre><textarea id="codeBox" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" dir="ltr" aria-label="محرر الكود"></textarea></div></div></div>`;

function setupEditor(initial, onChange){
  const ta = document.getElementById("codeBox"), pre = ta.previousElementSibling, code = document.getElementById("hlCode"), gut = document.getElementById("gutter");
  let errLine = null;
  function paint(){
    const v = ta.value;
    code.innerHTML = hl(v) + (v.endsWith("\n") ? " " : "");
    const n = v.split("\n").length; let g = "";
    for(let i=1;i<=n;i++) g += `<div${i===errLine?' class="err"':""}>${i}</div>`;
    gut.innerHTML = g; sync();
  }
  function sync(){ pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; gut.scrollTop = ta.scrollTop; }
  function insert(text, back){
    const s = ta.selectionStart, e = ta.selectionEnd; ta.focus();
    ta.setRangeText(text, s, e, "end");
    if(back) ta.selectionStart = ta.selectionEnd = ta.selectionEnd - back;
    paint(); onChange(ta.value);
  }
  ta.value = initial; paint();
  ta.addEventListener("input", ()=>{ errLine=null; paint(); onChange(ta.value); });
  ta.addEventListener("scroll", sync);
  ta.addEventListener("keydown", ev=>{
    if(ev.key==="Tab"){
      ev.preventDefault();
      if(ev.shiftKey){
        const s = ta.selectionStart, ls = ta.value.lastIndexOf("\n", s-1)+1;
        const lead = /^ {1,4}/.exec(ta.value.slice(ls)); if(lead){ ta.setRangeText("", ls, ls+lead[0].length, "end"); ta.selectionStart = ta.selectionEnd = Math.max(ls, s-lead[0].length); paint(); onChange(ta.value); }
      } else insert("    ");
    } else if(ev.key==="Enter" && (ev.ctrlKey||ev.metaKey)){
      ev.preventDefault(); const rb = document.getElementById("runBtn"); if(rb && !rb.hidden) rb.click();
    } else if(ev.key==="Enter"){
      ev.preventDefault();
      const s = ta.selectionStart, ls = ta.value.lastIndexOf("\n", s-1)+1, line = ta.value.slice(ls, s);
      let ind = (/^\s*/.exec(line)||[""])[0];
      if(/:\s*(#.*)?$/.test(line)) ind += "    ";
      insert("\n"+ind);
    } else if(ev.key==="Backspace" && ta.selectionStart===ta.selectionEnd){
      const s = ta.selectionStart, ls = ta.value.lastIndexOf("\n", s-1)+1, before = ta.value.slice(ls, s);
      if(before.length>=4 && /^ +$/.test(before)){ ev.preventDefault(); const k = before.length%4 || 4; ta.setRangeText("", s-k, s, "end"); paint(); onChange(ta.value); }
    }
  });
  document.querySelectorAll(".key").forEach(b=> b.onclick = () => {
    const k = b.dataset.k;
    if(k==="TAB") insert("    ");
    else if(k.length===2 && ["()","\"\"","[]","{}"].includes(k)) insert(k, 1);
    else insert(k);
  });
  return { get: () => ta.value, set: v => { ta.value = v; errLine=null; paint(); onChange(v); }, markErr: n => { errLine = n; paint(); } };
}

function showConsole(items, label){
  const box = document.getElementById("console");
  if(!box) return;
  let h = `<div class="title">${esc(label||"شاشة البرنامج")}</div>`, text = "";
  items.forEach(it=>{ if(it.k==="o") text += it.t; else text += "\u0000IN" + it.p + "\u0001" + (it.missing ? "⟨مفيش مدخل!⟩" : it.v) + "\u0002\n"; });
  if(text.length > 6000) text = text.slice(0, 6000) + "\n…";
  if(!text) h += `<div class="ln muted">البرنامج اشتغل ومطبعش حاجة.</div>`;
  else text.replace(/\n$/,"").split("\n").forEach(l=>{
    const m = /^(.*)\u0000IN(.*)\u0001(.*)\u0002$/.exec(l);
    h += m ? `<div class="ln">${esc(m[1]+m[2])}<span class="in">${esc(m[3])}</span></div>` : `<div class="ln">${esc(l)}</div>`;
  });
  box.innerHTML = h; box.scrollTop = box.scrollHeight;
}
function fb(kind, title, bodyHTML){
  const el = document.getElementById("feedback");
  if(!el) return;
  el.innerHTML = `<div class="fb ${kind}">${mascot()}<div class="fb-body"><h4>${esc(title)}</h4>${bodyHTML||""}</div></div>`;
  el.scrollIntoView({block:"nearest", behavior:"smooth"});
}
let onSyntax = null;
function errFeedback(r, code, ed, note){
  const info = errInfo(r.err, r.tooMuch), f = friendly(info, code);
  if(/Syntax|Indentation|Parse|Token/.test(info.name) && onSyntax) onSyntax();
  const lines = code.split("\n").length;
  if(ed && info.line && info.line <= lines) ed.markErr(info.line);
  const inTest = info.line && info.line > lines && info.name!=="TimeLimitError";
  fb("bad", inTest ? "الدالة بتاعتك وقعت وسمسم بيجربها" : f.t, `<p>${esc(f.p)}</p>${note?`<p>${note}</p>`:""}<div class="tech">${esc(info.name==="TimeLimitError"?"TimeLimitError: program ran too long":info.msg)}</div>`);
  beep("bad");
}
function skOk(){
  if(typeof Sk === "undefined" || !Sk.importMainWithBody){ fb("bad","بايثون لسه ماتحمّلش",`<p>اتأكد إن النت شغال، وبعدين اعمل تحديث للصفحة.</p>`); return false; }
  return true;
}
async function runTests(l, code, ed){
  const tests = l.tests || [{inputs:[], expected:l.expected}];
  for(let ti=0; ti<tests.length; ti++){
    const t = tests[ti], MARK = "@@SAMSAM_CHECK@@";
    const full = t.call ? code + "\n\nprint(\""+MARK+"\")\n" + t.call + "\n" : code;
    const r = await runPython(full, t.inputs||[]);
    let got = r.out;
    if(t.call){ const ix = got.indexOf(MARK+"\n"); got = ix>=0 ? got.slice(ix+MARK.length+1) : ""; }
    showConsole(t.call ? [{k:"o", t:got}] : r.items, tests.length>1 ? `تجربة ${ti+1} من ${tests.length}` : "شاشة البرنامج");
    const inNote = t.inputs && t.inputs.length ? `سمسم كتب للبرنامج: <b>${esc(t.inputs.join("، "))}</b>` : "";
    if(r.err){ errFeedback(r, code, ed, inNote); return false; }
    if(r.items.some(it=>it.k==="i" && it.missing)){ fb("bad","برنامجك طلب مدخلات أكتر من اللازم",`<p>${inNote}</p><p>اتأكد إنك بتستخدم input() بعدد المرات المطلوبة بس، وإن الحلقة بتخرج بـ break.</p>`); beep("bad"); return false; }
    if(t.check){
      const m = t.check(got);
      if(m){ fb("bad","قرّبت! بس الناتج مش مظبوط",`<div class="cmp"><div><b>برنامجك طلّع</b><pre>${esc(got.replace(/\n$/,""))}</pre></div></div><p>${esc(m)}</p>`); beep("bad"); return false; }
      continue;
    }
    let A = norm(got), B = norm(t.expected);
    if(l.anyOrder){ A = A.split("\n").sort().join("\n"); B = B.split("\n").sort().join("\n"); }
    if(A !== B){
      let tip;
      if(!A) tip = "برنامجك مطبعش حاجة خالص. متنساش print!";
      else if(/^None$/m.test(A) && t.call) tip = "طلع None؟ يبقى الدالة بتطبع أو مبترجّعش حاجة. استخدم return.";
      else if(A.split("\n").length !== B.split("\n").length) tip = `المطلوب ${B.split("\n").length} سطر، وبرنامجك طبع ${A.split("\n").length}.`;
      else tip = "قارن السطور كويس، حرف حرف.";
      const callNote = t.call ? `سمسم جرّب: <code class="ic">${esc(t.show)}</code>` : inNote;
      fb("bad","قرّبت! بس الناتج مختلف",`${callNote?`<p>${callNote}</p>`:""}<div class="cmp"><div><b>المطلوب</b><pre>${esc(t.expected)}</pre></div><div><b>برنامجك طلّع</b><pre>${esc(got.replace(/\n$/,""))}</pre></div></div><p>${esc(tip)}</p>`);
      beep("bad"); return false;
    }
  }
  const clean = stripComments(code);
  for(const [re,msg] of (l.need||[])) if(!re.test(clean)){ fb("warn","الناتج صح! بس فاضل حاجة",`<p>${esc(msg)}</p>`); beep("bad"); return false; }
  for(const [re,msg] of (l.avoid||[])) if(re.test(clean)){ fb("warn","الناتج صح! بس…",`<p>${esc(msg)}</p>`); beep("bad"); return false; }
  if(l.extra){ const m = l.extra(clean); if(m){ fb("warn","الناتج صح! بس فاضل حاجة",`<p>${esc(m)}</p>`); beep("bad"); return false; } }
  return true;
}

function liveRunner(getCode, onDone, ed){
  const runBtn = document.getElementById("runBtn"), stopBtn = document.getElementById("stopBtn");
  runBtn.onclick = async () => {

    if(r.stopped) fb("warn","وقّفت البرنامج",`<p>تقدر تشغّله تاني في أي وقت.</p>`);
    else if(r.err) errFeedback(r, code, ed);
    else if(onDone) onDone();
  };
  stopBtn.onclick = stopLive;
}

function openPredict(l){

    <section class="panel quiz"><div class="panel-h"><span class="tag">🔮 خمّن الناتج</span> ${S.done[l.id]?starsHTML(S.done[l.id]):xpLabel(l)}</div>
      <div class="panel-b">
        ${say("بص على الكود ده كويس، وتخيّل إنك الكمبيوتر. إيه اللي هيطلع على الشاشة؟ لو جاوبت صح من أول مرة تاخد 3 نجوم!")}
        <div class="snip"><pre>${hl(l.code)}</pre></div>
        <div class="opts">${l.opts.map((o,k)=>`<button class="opt ${/^[\x00-\x7F\s]+$/.test(o)?"mono":""}" data-k="${k}">${esc(o)}</button>`).join("")}</div>
        <div id="quizWhy"></div>
        <div class="console" id="console" hidden></div>
      </div></section>
  </div></div></div>`;
  paintStats(); wireTop(l);
  const why = document.getElementById("quizWhy");
  app.querySelectorAll(".opt").forEach(b=> b.onclick = async () => {
    const k = +b.dataset.k;
    if(k===l.a){
      app.querySelectorAll(".opt").forEach(x=>x.disabled = true); b.classList.add("right");
      why.innerHTML = `<div class="quiz-why ok">صح! ${esc(l.why)}</div>`;
      if(typeof Sk !== "undefined"){ const r = await runPython(l.code, []); const c = document.getElementById("console"); if(c){ c.hidden = false; showConsole(r.items, "الكمبيوتر طلّع فعلاً:"); } }
      setTimeout(()=> win(l, tries===0 ? 3 : tries===1 ? 2 : 1, l.why), 700);
    } else {
      tries++; b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); b.disabled = true;
      why.innerHTML = `<div class="quiz-why no">لأ، مش دي. امشي على الكود سطر سطر وجرّب تاني.</div>`; beep("bad");
    }
  });
  window.scrollTo({top:0});
}

function openOrder(l){
  const w = WORLDS[l.w];
  const all = l.lines.concat(l.decoy||[]);
  let pool = shuffle(all.map((_,k)=>k));
  if(pool.slice(0, l.lines.length).every((v,k)=>v===k)) pool.reverse();
  let answer = [], fails = 0, hinted = false;
  app.innerHTML = `<div style="--wc:${w.c}; --wb:${w.b}">${levelTop(l)}
  <div class="bench">
    <div class="col"><section class="panel lessonp"><div class="panel-h"><span class="tag">🧩 لغز الترتيب</span> رتّب الكود</div><div class="panel-b lesson">
      ${say(l.task)}
      ${say("دوس على السطر علشان تنقله لبرنامجك، ودوس عليه تاني لو عايز ترجّعه. النقط اللي في أول السطر هي المسافات.", "blueish")}
      ${l.expected ? `<div class="expect"><span>الناتج المطلوب:</span><pre>${esc(l.expected)}</pre></div>` : ""}
    </div></section></div>
    <div class="col"><section class="panel task"><div class="panel-h"><span class="tag">السطور</span> ${S.done[l.id]?starsHTML(S.done[l.id]):xpLabel(l)}</div><div class="panel-b">
      <div class="zone" id="poolZ"></div>
      <div class="zone answer" id="ansZ"></div>
      <div class="actions"><button class="btn mint big" id="checkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>تحقّق</button><span class="spacer"></span><button class="btn sun" id="hintBtn">💡 تلميح</button><button class="btn" id="clearBtn">رجّع كله</button></div>
      <div id="hintArea"></div>
      <div class="console" id="console"><div class="title">شاشة البرنامج</div><div class="ln muted">رتّب السطور ودوس «تحقّق».</div></div>
      <div id="feedback" aria-live="polite"></div>
    </div></section></div>
  </div></div>`;
  paintStats(); wireTop(l);
  const chip = (k, no) => { const s = all[k], lead = (/^ */.exec(s)||[""])[0];
    return `<button class="chip" data-k="${k}">${no?`<span class="no">${no}</span>`:""}<span>${lead?`<span class="lead">${lead}</span>`:""}${hlLine(s.slice(lead.length))}</span></button>`; };
  function paint(){
    document.getElementById("poolZ").innerHTML = `<h4>السطور المتلخبطة</h4>` + (pool.length ? pool.map(k=>chip(k)).join("") : `<div class="empty">خلصت كل السطور!</div>`);
    document.getElementById("ansZ").innerHTML = `<h4>برنامجك</h4>` + (answer.length ? answer.map((k,ix)=>chip(k, ix+1)).join("") : `<div class="empty">دوس على سطر من فوق علشان تبدأ</div>`);
    document.querySelectorAll("#poolZ .chip").forEach(b=> b.onclick = () => { const k=+b.dataset.k; pool = pool.filter(x=>x!==k); answer.push(k); beep("pop"); paint(); });
    document.querySelectorAll("#ansZ .chip").forEach(b=> b.onclick = () => { const k=+b.dataset.k; answer = answer.filter(x=>x!==k); pool.push(k); paint(); });
  }
  paint();
  document.getElementById("clearBtn").onclick = () => { pool = pool.concat(answer); answer = []; paint(); };
  document.getElementById("hintBtn").onclick = () => { hinted = true; document.getElementById("hintArea").innerHTML = `<div class="hintbox"><b>💡 تلميح:</b> ${esc(l.hint)}<span>أول سطر في البرنامج هو:</span><div class="snip"><pre>${hl(l.lines[0])}</pre></div></div>`; };
  const checkBtn = document.getElementById("checkBtn");
  checkBtn.onclick = async () => {
    if(running || !skOk()) return;
    document.getElementById("feedback").innerHTML = "";
    if(!answer.length){ fb("warn","لسه مرتّبتش حاجة",`<p>دوس على السطور اللي فوق بالترتيب الصح.</p>`); return; }
    const code = answer.map(k=>all[k]).join("\n");
    running = true; checkBtn.disabled = true;
    let ok = false;
    try{ ok = await runTests(l, code, null); } finally{ running = false; checkBtn.disabled = false; }
    if(ok && pool.some(k=>k < l.lines.length)){ ok = false; fb("warn","الناتج صح! بس فاضل سطور",`<p>استخدم كل السطور المهمة.</p>`); }
    if(ok) win(l, fails===0 && !hinted ? 3 : fails<=2 ? 2 : 1);
    else fails++;
  };
  window.scrollTo({top:0});
}

/* ===================== الفوز ===================== */
function win(l, stars, note){
  const beforeBadges = earnedBadges();
  const prev = S.done[l.id] || 0;
  const gained = Math.max(0, levelValue(l, stars) - levelValue(l, prev));
  if(stars > prev) S.done[l.id] = stars;
  if(l.type!=="play") S.combo = stars===3 ? (S.combo||0) + 1 : 0;
  const comboBonus = S.combo >= 3 && gained && l.type!=="play" ? 5 : 0;
  const xpBefore = S.xp;
  addXP(gained + comboBonus);
  beep("win"); confetti();
  const isLast = l.n === L.length-1;
  const praise = ["برافو عليك!","إنت جامد!","عاش يا بطل!","مبرمج حقيقي!","سمسم فخور بيك!","يا سلام عليك!"][l.n % 6];
  const wd = worldDone(l.w);
  const outfitNew = OUTFITS.find(o=> o.xp>0 && S.xp >= o.xp && xpBefore < o.xp);
  const newBadges = BADGES.filter(b=>b.ok() && !beforeBadges.includes(b.id));
  const all = doneCount()===L.length;
  modal(`${mascot()}
    <h2>${all ? "إنت Python Game Developer! 🎓" : praise}</h2>
    ${starsHTML(stars, "bigstars")}
    ${gained + comboBonus ? `<span class="xpgain">+${gained + comboBonus} XP</span>` : ""}
    ${comboBonus ? `<p><b>🔥 كومبو ×${S.combo}!</b> كذا مستوى ورا بعض بـ 3 نجوم</p>` : ""}
    <p>${note ? esc(note) : stars===3 ? "حليتها لوحدك من غير مساعدة!" : stars===2 ? "حلو! جرّب المرة الجاية من غير مساعدة علشان الـ 3 نجوم." : "مش مشكلة، ارجع جرّبه تاني بعدين وخد نجوم أكتر."}</p>
    ${newBadges.map(b=>`<div class="newbadge">شارة جديدة: ${b.e} ${esc(b.n)}</div>`).join("")}
    ${wd ? `<p style="color:var(--pink-d)"><b>${WORLDS[l.w].e} خلّصت «${esc(WORLDS[l.w].name)}» وخدت ملصق جديد!</b></p>` : ""}
    ${outfitNew ? `<p style="color:#7A60D6"><b>👒 اتفتح لبس جديد في دولاب سمسم: ${esc(outfitNew.n)}</b></p>` : ""}
    <div class="modal-actions">
      ${all ? `<button class="btn big sun" id="mCert">🎓 الشهادة</button>` : ""}
      ${isLast ? "" : `<button class="btn big pink" id="mNext">اللي بعده</button>`}
      <button class="btn big" id="mMap">الخريطة</button>
      <button class="btn big" id="mStay">خليني هنا</button>
    </div>`);
  const n = document.getElementById("mNext"); if(n){ n.onclick = () => openLevel(l.n+1); n.focus(); }
  const c = document.getElementById("mCert"); if(c) c.onclick = openCert;
  document.getElementById("mMap").onclick = renderMap;
  document.getElementById("mStay").onclick = closeModal;
}
